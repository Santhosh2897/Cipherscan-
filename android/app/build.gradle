// CipherScan — app/build.gradle
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-parcelize'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localProperties.load(new FileInputStream(localPropertiesFile))
}

android {
    namespace 'com.cipherscan.android'
    compileSdk 34

    defaultConfig {
        applicationId "com.cipherscan.android"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        // Inject backend URL from local.properties:
        //   cipherscan.server.url=https://your-backend.replit.app/
        buildConfigField "String", "CIPHERSCAN_SERVER_URL",
            "\"${localProperties['cipherscan.server.url'] ?: 'http://10.0.2.2:8080/'}\""

        // Inject API key from local.properties (must match APP_API_KEY on
        // the backend). Generate one with: openssl rand -hex 32
        //   cipherscan.api.key=your_generated_key_here
        buildConfigField "String", "CIPHERSCAN_API_KEY",
            "\"${localProperties['cipherscan.api.key'] ?: ''}\""
    }

    
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // Kotlin
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // AndroidX
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'

    // Material Design 3
    implementation 'com.google.android.material:material:1.11.0'

    // Networking — Retrofit + OkHttp
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // Image loading — Coil (Kotlin-first, coroutine-aware)
    implementation 'io.coil-kt:coil:2.5.0'
}
