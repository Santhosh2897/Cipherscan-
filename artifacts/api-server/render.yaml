services:
  - type: web
    name: cipherscan-api
    runtime: node
    plan: free
    rootDir: artifacts/api-server
    buildCommand: >
      cd ../.. &&
      pnpm install &&
      pnpm --filter @workspace/api-zod run build &&
      pnpm --filter @workspace/db run build &&
      pnpm --filter artifacts/api-server run build
    startCommand: node --enable-source-maps dist/index.mjs
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: APP_API_KEY
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false
      - key: VIRUSTOTAL_API_KEY
        sync: false
      - key: GOOGLE_SAFE_BROWSING_API_KEY
        sync: false